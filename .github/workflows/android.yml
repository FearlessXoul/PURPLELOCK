name: Build PURPLELOCK Face Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Face Test APK
        run: gradle assembleFaceTestDebug

      - name: Upload Face Test APK
        uses: actions/upload-artifact@v4
        with:
          name: PURPLELOCK-FACE-TEST
          path: app/build/outputs/apk/faceTest/debug/app-faceTest-debug.apk
